[package]
name = "wafflebar-core"
description = "Core library for wafflebar: config schema, grid layout engine, and shared types (GTK-free)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Desktop entry parsing per fd.o spec. NOTE: its Exec field-code expansion is buggy (%i emits
# one arg, not --icon <val>; naive whitespace tokenizer) and its locale env helper is non-spec
# (LANG only, no LC_MESSAGES, no fallback chain) — so field-code expansion is hand-rolled in
# core::freedesktop::exec and the locale chain in core::freedesktop::locale.
freedesktop-desktop-entry = "~0.8.1"
