[package]
name = "wafflebar"
description = "A griddy Wayland status bar. No bloat."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "wafflebar"
path = "src/main.rs"

[dependencies]
wafflebar-core = { path = "../wafflebar-core" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gtk4 = { version = "0.11.3", features = ["v4_12"] }
gtk4-layer-shell = "0.8.0"
chrono = "0.4.44"
chrono-tz = "0.10.4" # IANA timezone DB for the clock's `timezone` option (MIT/Apache)
clap = { version = "4.6.1", features = ["derive"] }
wayland-client = "0.31.14"
wayland-scanner = "0.31.10"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zbus = "5.15.0"
# PulseAudio client API; works against pipewire-pulse on PipeWire systems. FFI to libpulse (already a system library).
libpulse-binding = "2.30"
# Integrates libpulse's mainloop API into GLib so subscription events wake our existing loop rather than a separate thread.
libpulse-glib-binding = "2.29"
# Preferences-UI write-back (F3): edits the user's config.toml in place, preserving comments, key
# order, and whitespace. A serialize-from-`Config` round-trip would discard all of that.
toml_edit = "0.22"
# Notification server (G): bridge `Notify` calls from zbus's executor thread to the GLib main
# thread. The spec has no "posted" signal to ride (unlike the SNI Watcher's ItemRegistered), so a
# thread-safe channel is the iface→main bridge. Already resolved transitively via zbus.
async-channel = "2.5"
# sway/i3 backend: the i3-ipc payload is JSON over a framed socket. serde derives the reply structs.
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
# GTK + Wayland deps are added via `cargo add` (M1) so versions resolve compatibly.

[dev-dependencies]
# Used to construct ModuleConfig.options in tests; runtime config loading lives in core::config.
# Reuses the workspace `toml` already pulled in by wafflebar-core; no new external dep.
toml.workspace = true
