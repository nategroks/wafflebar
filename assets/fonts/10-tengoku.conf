<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tengoku is a grid-aligned pixel-ish face (design grid = 1/12 em). Antialiasing and hinting both
     fight that: AA smears the hard edges the design depends on, and the hinter snaps stems that are
     already integral at on-grid sizes. Turn both off for this family only. -->
<fontconfig>
  <match target="font">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Tengoku</string>
    </test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- Tengoku has no icon/powerline coverage and is proportional. Give it explicit fallbacks so a
       missing glyph degrades to the bar's other faces instead of to tofu. -->
  <alias binding="weak">
    <family>Tengoku</family>
    <prefer>
      <family>Hurmit Nerd Font Mono</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
</fontconfig>
